unbind r
bind r source-file ~/.tmux.conf

# Leader key rebind
set -g prefix C-s

# Act like vim
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g mouse on

# Mouse-copy behavior:
# Releasing a selection copies it to the clipboard and FINISHES the
# highlight (it un-highlights), but keeps your scroll position instead of
# jumping to the bottom (default is copy-selection-and-cancel).
# To get back to the prompt: press Escape, i, or q — or scroll to the
# bottom, which exits automatically.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind   -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
bind   -T copy-mode-vi Escape send-keys -X cancel
bind   -T copy-mode-vi i      send-keys -X cancel

# Visual styling
set -g status-position bottom

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

# Pane resizing
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Preserve modified keys sent by the terminal
set -g extended-keys on
set -g extended-keys-format csi-u

# Tell tmux the outer terminal (Alacritty) supports 24-bit colour
set -as terminal-features ',alacritty:RGB:extkeys,xterm-256color:RGB:extkeys'

# Status bar: minimal, Catppuccin Latte colours
set -g status-style "bg=#e6e9ef,fg=#4c4f69"
set -g status-left " #S  "
set -g status-left-style "fg=#6c6f85"
set -g status-right " %H:%M "
set -g status-right-style "fg=#6c6f85"
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
set -g window-status-current-style "bg=#1e66f5,fg=#eff1f5,bold"
set -g window-status-separator ""
set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#9ca0b0"
set -g message-style "bg=#e6e9ef,fg=#4c4f69"
set -g mode-style "bg=#ccd0da,fg=#4c4f69"
